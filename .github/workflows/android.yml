name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Project (Vite/React)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          # Le receveur LocalNotificationRestoreReceiver n'est plus déclaré dans le
          # manifeste de l'app : le plugin @capacitor/local-notifications le déclare
          # lui-même (exported="false", directBootAware, BOOT_COMPLETED +
          # LOCKED_BOOT_COMPLETED + QUICKBOOT_POWERON). Le patch tools:replace qui
          # existait ici n'a donc plus d'objet.

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noutq-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
